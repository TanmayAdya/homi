name: safe_at_home
description: "Reviewable home findings and explained assistance program matches."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  homi_local_llm:
    path: packages/homi_local_llm
  cupertino_icons: ^1.0.8
  flutter_local_notifications: 22.3.2
  flutter_timezone: 5.1.1
  timezone: 0.11.2
  crypto: 3.0.7
  supabase_flutter: 2.18.3
  flutter_secure_storage: 11.2.0
  cryptography: 2.9.0
  cryptography_flutter: 2.3.4
  path_provider: 2.1.6
  camera: 0.12.0+2
  image_picker: 1.2.4
  pdfrx:
    path: third_party/pdfrx
  share_plus: 13.3.1
  url_launcher: 6.3.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - backend/src/assessment/steadi-catalog.json
    - contracts/v1/fixtures/scenarios.json
    - contracts/v1/fixtures/packets.json




